name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild clean archive \
            -project Aria.xcodeproj \
            -scheme Aria \
            -configuration Release \
            -archivePath build/Aria.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Aria.xcarchive/Products/Applications/Aria.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Aria-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Aria-Unsigned-IPA
          path: Aria-unsigned.ipa
